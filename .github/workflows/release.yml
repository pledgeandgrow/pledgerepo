# PledgePack release workflow
# Builds pre-compiled binaries for Windows, macOS, and Linux on git tag push.
# Creates GitHub Release with binaries and publishes npm package.

name: Release

permissions:
  contents: write

# Trigger on tag push matching v*.*.*
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  # Read version from package.json
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      app-version: ${{ steps.plan.outputs.app-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: plan
        run: |
          VERSION=$(jq -r '.version' package.json)
          TAG=$(git describe --tags --abbrev=0)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "app-version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Tag: $TAG"

  # Build binaries for each platform
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-linux
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
            zig_target: aarch64-linux
          - os: macos-14
            target: x86_64-apple-darwin
            zig_target: x86_64-macos
          - os: macos-14
            target: aarch64-apple-darwin
            zig_target: aarch64-macos
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            zig_target: x86_64-windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install cross-linker (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Zig native library
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}

      - name: Build pledge binary
        run: cargo build --release --target ${{ matrix.target }} --bin pledge

      - name: Package binary (Unix)
        if: matrix.os != 'windows-2022'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pledge dist/
          tar czf pledge-${{ matrix.target }}.tar.gz -C dist pledge

      - name: Package binary (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/pledge.exe dist/
          Compress-Archive -Path dist/pledge.exe -DestinationPath pledge-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pledge-${{ matrix.target }}
          path: |
            pledge-${{ matrix.target }}.tar.gz
            pledge-${{ matrix.target }}.zip

  # Publish GitHub Release with all binaries
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: Release ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip

  # Publish npm package (tiny — JS launcher + postinstall downloads binary from GitHub Releases)
  publish-npm:
    needs: [plan, build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
