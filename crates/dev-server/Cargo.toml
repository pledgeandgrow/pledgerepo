[package]
name = "pledgepack-dev-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true, features = ["compression-gzip", "fs", "trace"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
pledgepack-core = { workspace = true }
pledgepack-js-plugin-host = { workspace = true }
pledgepack-native-sys = { path = "../../native-sys" }
oxc = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["alloc"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = "0.3"
similar = { workspace = true }
opener = { workspace = true }
local-ip-address = { workspace = true }
rcgen = "0.14"

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }
bytemuck = "1.21"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
