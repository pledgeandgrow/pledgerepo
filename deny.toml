[advisories]
# cargo-deny checks for known vulnerabilities in dependencies.
version = 2
ignore = [
    # rkyv 0.7 — OOB reads in archives with Rc/Arc. Transitive via parcel_sourcemap
    # (lightningcss). Cannot upgrade until parcel_sourcemap releases a new version.
    # Risk is low: only used for sourcemap encoding, not untrusted input.
    "RUSTSEC-2026-0235",
    # bincode 2.0.1 — flagged as unmaintained. This is the latest major version
    # and is stable/feature-complete. No viable drop-in replacement with serde support.
    # Will revisit if a maintained fork emerges.
    "RUSTSEC-2025-0141",
    # paste 1.0.15 — compile-time macro crate, no runtime code. Transitive via
    # oxc and lightningcss. Zero security risk.
    "RUSTSEC-2024-0436",
]

[licenses]
# Allow only OSI-approved licenses
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
]
# Allow specific exceptions
exceptions = []

[bans]
# Warn on duplicate versions of the same crate
multiple-versions = "warn"
# Warn on wildcards in Cargo.toml
wildcards = "warn"

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "allow"  # Allow git deps (e.g., relative-path if needed)
